version: '2.0'
services:
    headscale :
        container_name: ${DOCKER_SERVICE} 
        restart: always
        expose:
          - '8080'
        volumes:
          - './config:/etc/headscale/'
        image: headscale/headscale:0.23.0
        environment:
          - VIRTUAL_HOST=${HOST_NAME}
          - VIRTUAL_PORT=8080
          - VIRTUAL_PATH=/
          - LETSENCRYPT_HOST=${HOST_NAME}
        networks:
          - proxy-net
        command: serve
    headscale-ui:
        container_name: headscale-ui
        image: ghcr.io/gurucomputing/headscale-ui:2024.10.10
        restart: always
        expose:
          - '8080'
        ports:
          - '8080:8080'
        environment:
          - VIRTUAL_HOST=${HOST_NAME}
          - VIRTUAL_PORT=8080
          - VIRTUAL_PATH=/web
          - LETSENCRYPT_HOST=${HOST_NAME}
        networks:
          - proxy-net

networks:
    proxy-net:
        external:
            name: nginx-proxy_default
